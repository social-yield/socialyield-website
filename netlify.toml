# ─── Build settings ──────────────────────────────────────────────────────────
[build]
  publish = "."

# Pretty URLs: Netlify will serve /insights for insights.html etc.
# (This is on by default but we set it explicitly for clarity.)
[build.processing.html]
  pretty_urls = true

# ─── Permanent redirects: strip .html so the canonical URL wins ─────────────
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/insights.html"
  to = "/insights"
  status = 301
  force = true

[[redirects]]
  from = "/article-template.html"
  to = "/insights/social-housing-demand-2025"
  status = 301
  force = true

[[redirects]]
  from = "/article-template"
  to = "/insights/social-housing-demand-2025"
  status = 301
  force = true

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/privacy-policy.html"
  to = "/privacy-policy"
  status = 301
  force = true

[[redirects]]
  from = "/terms.html"
  to = "/terms"
  status = 301
  force = true

# ─── Pretty URL → file mapping for our new article slug ─────────────────────
[[redirects]]
  from = "/insights/social-housing-demand-2025"
  to = "/article-template.html"
  status = 200

# ─── Custom 404 (Netlify auto-serves /404.html for not-found, but keep explicit) ─
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# ─── Security headers ───────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com https://www.googletagmanager.com; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://www.googletagmanager.com; form-action 'self'; frame-ancestors 'none'; base-uri 'self';"
